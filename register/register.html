<html>
  <head>
    <title>register</title>
	<link rel="stylesheet" href="register.css">
  </head>
  <body>
    <form action="register.php" method="post" id="registerform">
      <div>
      username:
      <label><input type="text"name="username" id="username" required maxlength="10"></label>
      </div>
      <div>
      password:
      <label><input type="password"name="password" id="password"required></label>
      </div>
      <div>
      email:
      <label><input type="email" name="email"required></label>
      </div>
      <div>
      tel:
      <label><input type="tel" name="tel"required></label>
      </div>
      <div>
      birthday:
      <label><input type="date" name="birthday"></label>
      </div>
      <div>
      gender:
      <label><input type="radio" name="gender" value="male">male</label>
      <label><input type="radio" name="gender" value="female">female</label>
      </div>
      <div>
      interested:
      <label><input type="checkbox" name="interested[]" value="pop">Pop</label>
      <label><input type="checkbox" name="interested[]" value="jazz">Jazz</label>
      <label><input type="checkbox" name="interested[]" value="classical">classical</label>
	  <label><input type="checkbox" name="interested[]" value="Rock">Rock</label>
	  <label><input type="checkbox" name="interested[]" value="Country">Country</label>
	  <label><input type="checkbox" name="interested[]" value="Hip-hop">Hip-hop</label>
      </div>
      <div>
      country:
      <lable><select name="country">
        <option value="China">China</option>
        <option value="USA">U.S.A.</option>
        <option value="UK">United Kingdom</option>
		<option value="Australia">Australia</option>
		<option value="Japan">Japan</option>
		<option value="Singapore">Singapore</option>
		<option value="France">France</option>
		<option value="Germany">Germany</option>
		<option value="Italy">Italy</option>
		<option value="Nigeria">Nigeria</option>
		<option value="Egypt">Egypt</option>
		<option value="Thailand">Thailand</option>
		<option value="India">India</option>
		<option value="Korea">Korea</option>
		<option value="Mexico">Mexico</option>
      </select></lable>
      </div>
      <div>
      message(optional):
      <lable><textarea name="message" rows="4" cols="50" placeholder="anything to say?"></textarea></lable>
      </div>
      <button type="submit">submit</button>
      <button type="reset">reset</button>
    </form>
	<script>
    document.getElementById('registerform').addEventListener('submit', function(event) {
    const genderinputs = document.querySelectorAll('input[name="gender"]');
    let ischecked = false;
    
    for(let i = 0; i < genderinputs.length; i++) {
        if(genderinputs[i].checked) {
            ischecked = true;
            break;
        }
    }
    if (!ischecked) {
        alert('Please enter your gender');
        event.preventDefault();  
    }
	const interestinputs = document.querySelectorAll('input[name="interested[]"]');
    let interestchecked = false;
    
    for(let i = 0; i < interestinputs.length; i++) {
        if(interestinputs[i].checked) {
            interestchecked = true;
            break;
        }
    }
    if (!interestchecked) {
        alert('Please select at least one interest');
        event.preventDefault();  
        return;
    }
});
</script>

  </body>
</html>
