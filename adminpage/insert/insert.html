<html>
  <head>
    <title>admin</title>
    <style>
      body {
        background-color: #f0f8ff;
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      
      form {
        background-color: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 2px 2px 10px gray;
        max-width: 500px;
      }
      
      div {
        margin-bottom: 15px;
        padding: 10px;
      }
      
      input[type="text"] {
        width: 300px;
        padding: 5px;
        border: 1px solid #ccc;
        border-radius: 5px;
      }
      
      label {
        color: #333;
        font-weight: bold;
      }
      
      button {
        background-color: #4CAF50;
        color: white;
        padding: 8px 15px;
        border: none;
        border-radius: 5px;
        margin-right: 10px;
        cursor: pointer;
      }
      
      button:hover {
        background-color: #45a049;
      }
      
      button[type="reset"] {
        background-color: #f44336;
      }
      
      button[type="reset"]:hover {
        background-color: #da190b;
      }
    </style>
</head>
  <body>
    <form action="insert.php" method="post">
      <div>
      productname:
      <label><input type="text" name="productname" id="productname"required></label>
      </div>
      <div>
      price:
      <label><input type="text" name="price" id="price" required></label>
      </div>
      <div>
      description:
      <label><input type="text" name="description" id="description" required></label>
      </div>
      <div>
      file path:
      <label><input type="text" name="file_path" id="file_path" required></label>
      </div>
      <div>
      product status:
	  <label><input type="radio" name="product_status" value="onsale">onsale</label>
      <label><input type="radio" name="product_status" value="offsale">offsale</label>
      </div>
      <button type="submit">submit</button>
      <button type="reset">reset</button>
    </form>
  </body>
</html>
